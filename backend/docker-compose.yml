services:
  api:
    build:
      context: ..
      dockerfile: backend/api.Dockerfile
    init: true
    image: ${CHDXK_API_IMAGE:-chdxk/api:latest}
    container_name: ${CHDXK_API_CONTAINER:-chdxk_api}
    environment:
      TZ: Asia/Shanghai
      ARMS_ENABLE: true
      ARMS_APP_NAME: ${CHDXK_API_ARMS_APP_NAME:-chdxk_api}
      ARMS_REGION_ID: cn-shanghai
      ARMS_LICENSE_KEY: ""
    ports:
      - "8080:8080"

  task_worker:
    build:
      context: ..
      dockerfile: backend/taskworker.Dockerfile
    image: ${CHDXK_TASKWORKER_IMAGE:-chdxk/taskworker:latest}
    container_name: ${CHDXK_TASKWORKER_CONTAINER:-chdxk_taskworker}
    environment:
      TZ: Asia/Shanghai
      ARMS_ENABLE: true
      ARMS_APP_NAME: ${CHDXK_TASKWORKER_ARMS_APP_NAME:-chdxk_taskworker}
      ARMS_REGION_ID: cn-shanghai
      ARMS_LICENSE_KEY: ""
