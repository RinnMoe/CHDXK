# Example config for jcourse API server
# Config path can be set via --config flag or CONFIG_PATH env
# Any config value can be overridden by env with JCOURSE_ prefix, e.g.:
#   JCOURSE_SERVER_ADDR=:9090
#   JCOURSE_POSTGRES_DSN="host=localhost ..."
#   JCOURSE_REDIS_ADDR=localhost:6379

server:
  addr: ":8080"

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=jcourse sslmode=disable"

redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0

session:
  secret: "replace-with-at-least-32-random-characters"
  max_age: 604800
  secure: false

auth:
  registration:
    email_whitelist:
      - "@example.edu"
    code_interval: "1m"
    code_ttl: "10m"
    code_length: 6
  password_reset:
    code_interval: "1m"
    code_ttl: "10m"
    code_length: 6
  login:
    max_attempts: 5
    lockout: "15m"
  password_hash:
    iterations: 720000
    salt_length: 12
  username_deriver:
    salt: "SALT"

review:
  frequency_policy:
    window: "1h"
    max_reviews: 10
    similarity_ratio: 0.7
  command:
    hot_scores:
      review_create_score: 3
      review_update_score: 1
      review_vote_score: 1
    vote:
      max_daily_votes: 50

api_key:
  max_user_keys: 20

admin:
  default_suspend_days: 30

point:
  rate_bps: 250
  min_fee: 1

asynq:
  concurrency: 10

stats:
  daily_cron: "10 0 * * *"
  scheduler_enabled: true
  timezone: "Asia/Shanghai"

smtp:
  host: "smtp.example.com"
  port: 587
  username: "noreply@example.com"
  password: ""
  from: "noreply@example.com"
