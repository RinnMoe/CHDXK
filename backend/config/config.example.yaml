# Example config for jcourse API server
# Config path can be set via --config flag or CONFIG_PATH env
# Any config value can be overridden by env with JCOURSE_ prefix, e.g.:
#   JCOURSE_SERVER_ADDR=:9090
#   JCOURSE_POSTGRES_DSN="host=localhost ..."
#   JCOURSE_REDIS_ADDR=localhost:6379

server:
  addr: ":8080"
  debug: false
  cors:
    allowed_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"

postgres:
  max_open_conns: 6
  max_idle_conns: 2
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=jcourse sslmode=disable"

redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0

session:
  secret: "replace-with-at-least-32-random-characters"
  max_age: 604800
  secure: false

auth:
  access:
    flush_cron: "*/5 * * * *"
    scheduler_enabled: true
    flush_batch_size: 1000

course:
  rating_score:
    prior_count: 5
    refresh_cron: "0 5 * * *"
    scheduler_enabled: true

review:
  safety_policy:
    enabled: false
    access_key_id: ""
    access_key_secret: ""
    region_id: "cn-shanghai"
    endpoint: "green-cip.cn-shanghai.aliyuncs.com"
    service: "comment_detection_pro"
    sensitive_level: "medium"
    connect_timeout: 3000
    read_timeout: 10000
api_key:
  snowflake_node_id: 1

point:
  rate_bps: 250
  min_fee: 1

asynq:
  concurrency: 10

stats:
  daily_cron: "10 0 * * *"
  scheduler_enabled: true
  timezone: "Asia/Shanghai"

smtp:
  host: "smtp.example.com"
  port: 587
  username: "noreply@example.com"
  password: ""
  from: "noreply@example.com"

# CHDXK has independent local accounts; res-hub provides SSO and shared points.
# Initial administrator password login does not require res-hub to be online.
reshub:
  # Discovery is read from this stable public OIDC issuer.
  issuer: "https://res-hub.example.com"
  client_id: "chdxk"
  client_secret: ""
  # Register this exact URL in res-hub; scheme, host, path and trailing slash matter.
  redirect_uri: "https://chdxk.example.com/api/auth/oidc/callback"
  logout_return_uri: "https://chdxk.example.com/"
  timeout: "3s"
  points_base_path: "/api/integrations/v1"
  # Optional mTLS certificate files mounted into the CHDXK service.
  client_cert_file: ""
  client_key_file: ""
  # Optional private CA bundle; public HTTPS issuers normally leave this empty.
  ca_file: ""

# Embedded pure-Go HTTP collector; no external SDK or browser required.
course_source:
  enabled: true
  # Catalog, teacher pages and school-identity-isolated semester checkpoints.
  # No login cookies stored; mount this directory persistently in Docker.
  cache_dir: ".local/course-cache"
