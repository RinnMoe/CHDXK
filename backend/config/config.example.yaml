# Example config for jcourse API server
# Config path can be set via --config flag or CONFIG_PATH env
# Any config value can be overridden by env with JCOURSE_ prefix, e.g.:
#   JCOURSE_SERVER_ADDR=:9090
#   JCOURSE_POSTGRES_DSN="host=localhost ..."
#   JCOURSE_REDIS_ADDR=localhost:6379

server:
  addr: ":8080"

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=jcourse sslmode=disable"

redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0

session:
  secret: "change-me-in-production"
  max_age: 604800
  secure: false

auth:
  email_whitelist:
    - "@example.edu"
  username_salt: "SALT"
  verification_code_interval: 60
  verification_code_ttl: 600
  verification_code_length: 6
  max_login_attempts: 5
  login_lockout_duration: 900
  password_hash_iterations: 720000
  password_salt_length: 12

review:
  frequency_window_seconds: 3600
  frequency_max_reviews: 10
  similarity_ratio: 0.7
  max_daily_votes: 50

api_key:
  max_user_keys: 20

admin:
  default_suspend_days: 30

point:
  transfer_fee_rate_bps: 250
  transfer_min_fee: 1

course_hot:
  review_create_score: 3
  review_update_score: 1
  review_vote_score: 1

asynq:
  concurrency: 10

stats:
  daily_cron: "10 0 * * *"
  scheduler_enabled: true
  timezone: "Asia/Shanghai"

smtp:
  host: "smtp.example.com"
  port: 587
  username: "noreply@example.com"
  password: ""
  from: "noreply@example.com"
