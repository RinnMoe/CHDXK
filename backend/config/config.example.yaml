# Example config for jcourse API server
# Config path can be set via --config flag or CONFIG_PATH env
# Any config value can be overridden by env with JCOURSE_ prefix, e.g.:
#   JCOURSE_SERVER_ADDR=:9090
#   JCOURSE_POSTGRES_DSN="host=localhost ..."
#   JCOURSE_REDIS_ADDR=localhost:6379

server:
  addr: ":8080"
  debug: false
  cors:
    allowed_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=jcourse sslmode=disable"

redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0

session:
  secret: "replace-with-at-least-32-random-characters"
  max_age: 604800
  secure: false

auth:
  access:
    flush_cron: "*/5 * * * *"
    scheduler_enabled: true
    flush_batch_size: 1000
  password_hash:
    iterations: 1200000
    salt_length: 22
  username_deriver:
    salt: "SALT"

course:
  rating_score:
    prior_count: 5
    refresh_cron: "0 5 * * *"
    scheduler_enabled: true

review:
  safety_policy:
    enabled: false
    access_key_id: ""
    access_key_secret: ""
    region_id: "cn-shanghai"
    endpoint: "green-cip.cn-shanghai.aliyuncs.com"
    service: "comment_detection_pro"
    sensitive_level: "medium"
    connect_timeout: 3000
    read_timeout: 10000
  command:
    frequency_violation_admin_emails: []

api_key:
  snowflake_node_id: 1

point:
  rate_bps: 250
  min_fee: 1

asynq:
  concurrency: 10

stats:
  daily_cron: "10 0 * * *"
  scheduler_enabled: true
  timezone: "Asia/Shanghai"

smtp:
  host: "smtp.example.com"
  port: 587
  username: "noreply@example.com"
  password: ""
  from: "noreply@example.com"

jaccount:
  course_sync_enabled: false
  client_id: ""
  client_secret: ""
  authorize_url: "https://jaccount.sjtu.edu.cn/oauth2/authorize"
  token_url: "https://jaccount.sjtu.edu.cn/oauth2/token"
  api_base_url: "https://api.sjtu.edu.cn/"
  redirect_url: "http://localhost:8080/api/course/enrollment-sync/callback"
  frontend_callback_url: "http://localhost:5173/course/mine/sync-callback"
  scopes: []
